[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-memory"
version = "0.1.0"
description = "Persistent memory with scope hierarchy for AI agents in Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Max Nardit", email = "max@nardit.com" }]
keywords = ["claude", "ai", "memory", "mcp", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2.0"]
dev = ["pytest>=8.0", "pytest-cov", "mcp>=1.0,<2.0"]

[project.scripts]
agent-memory = "agent_memory.cli:main"
agent-memory-session-start = "agent_memory.hooks:main_session_start"
agent-memory-post-tool-use = "agent_memory.hooks:main_post_tool_use"

[project.urls]
Homepage = "https://github.com/mnardit/agent-memory"
Repository = "https://github.com/mnardit/agent-memory"

[tool.pytest.ini_options]
testpaths = ["tests"]
